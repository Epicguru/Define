name: Build & Test

on:
  pull_request:
    branches: [ master, develop ]

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v5.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.1.0
        with:
          dotnet-version: 8.0.x

      # This global tool is required to build Monogame content which is used in a test.
      - name: Install mgcb
        run: dotnet tool install dotnet-mgcb --global

      # Grab dependencies like NuGet packages.
      - name: Restore dependencies
        run: dotnet restore
        
      # Build and test in debug mode:
      - name: Test
        run: dotnet test --configuration Debug --no-restore -- --report-trx --results-directory test-results --coverage --coverage-output-format cobertura
        continue-on-error: true

      # Generate a test report.
      - name: Test Report
        uses: dorny/test-reporter@v2.1.1
        if: success() || failure()
        with:
          name: Test Report
          path: Define*Tests/test-results/*.trx
          reporter: dotnet-trx
      
      - name: Merge coverage reports
        run: |
          dotnet tool install --global dotnet-coverage
          dotnet-coverage merge Define*Tests/test-results/*.cobertura.xml --output merged.cobertura.xml --output-format cobertura --remove-input-files

      # Generate code coverage report.
      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: merged.cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '70 75'

      # Post the results of the previous step as a PR comment.
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2.9.4
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md

      - name: Write coverage to step summary
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
