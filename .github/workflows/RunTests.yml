name: Build & Test

on:
  pull_request:
    branches: [ master, develop ]

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_VERSION: '10.0.x'

    steps:

      - uses: actions/checkout@v6.0.2

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v5.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # This global tool is required to build Monogame content which is used in a test.
      - name: Install mgcb
        run: dotnet tool install dotnet-mgcb --global

      # Grab dependencies like NuGet packages.
      - name: Restore dependencies
        run: dotnet restore
        
      # Build and test in debug mode:
      - name: Test (.NET ${{ env.DOTNET_VERSION }})
        run: dotnet test --configuration Debug --no-restore -- --report-trx --results-directory test-results-${{ env.DOTNET_VERSION }} --coverage --coverage-output-format cobertura
        continue-on-error: true

      # Generate a test report.
      - name: Test Report (.NET ${{ env.DOTNET_VERSION }})
        uses: dorny/test-reporter@v2.5.0
        if: success() || failure()
        with:
          name: Test Report (.NET ${{ env.DOTNET_VERSION }})
          path: test-results-${{ env.DOTNET_VERSION }}/*.trx
          reporter: dotnet-trx
      
      - name: Merge coverage reports (.NET ${{ env.DOTNET_VERSION }})
        run: |
          dotnet tool install --global dotnet-coverage
          dotnet-coverage merge test-results-${{ env.DOTNET_VERSION }}/*.cobertura.xml --output merged-${{ env.DOTNET_VERSION }}.cobertura.xml --output-format cobertura --remove-input-files

      # Generate code coverage report.
      - name: Code Coverage Report (.NET ${{ env.DOTNET_VERSION }})
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: merged-${{ env.DOTNET_VERSION }}.cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '70 75'

      # Post the results of the previous step as a PR comment.
      - name: Add Coverage PR Comment (.NET ${{ env.DOTNET_VERSION }})
        uses: marocchino/sticky-pull-request-comment@v2.9.4
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          header: ".NET ${{ env.DOTNET_VERSION }} Coverage"
          path: code-coverage-results.md

      - name: Write coverage to step summary (.NET ${{ matrix.dotnet-version }})
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
